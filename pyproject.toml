[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncforge"
version = "0.1.0"
description = "Starter file synchronization and backup service"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["syncforge*"]
